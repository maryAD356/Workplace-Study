<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Workplace Advice &amp; Support</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#0A5E4E;
    --green-deep:#073F34;
    --orange:#E85D04;
    --orange-deep:#C24C03;
    --mustard:#F2C14E;
    --bg:#FFFDF8;
    --panel:#FFFFFF;
    --text:#171717;
    --text-soft:#5A5750;
    --line:#E4DFD3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:Arial, Helvetica, sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  h1,h2,h3{font-family:'Playfair Display', Georgia, serif;font-weight:600;margin:0;}

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 28px;
    border-bottom:2px solid var(--green);
    background:var(--panel);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{width:11px;height:11px;background:var(--orange);display:inline-block;}
  .brand h1{font-size:18px;letter-spacing:0.01em;color:var(--green-deep);}
  .status-chip{
    font-family:'Courier New', monospace;
    font-size:11px;
    letter-spacing:0.03em;
    color:var(--text-soft);
    border:1px solid var(--line);
    padding:5px 10px;
    border-radius:4px;
  }

  .wrap{
    flex:1;
    display:flex;
    flex-direction:column;
    max-width:700px;
    width:100%;
    margin:0 auto;
    padding:0 22px;
  }

  /* ---------- Landing screen ---------- */
  .landing{
    max-width:560px;
    margin:56px auto;
    padding:0 20px;
  }
  .landing-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-top:4px solid var(--green);
    border-radius:6px;
    padding:38px 36px 34px 36px;
  }
  .landing-card h2{
    font-size:28px;
    line-height:1.25;
    color:var(--green-deep);
    margin-bottom:14px;
  }
  .landing-card p{
    font-size:15px;
    line-height:1.65;
    color:var(--text-soft);
    margin-bottom:16px;
  }
  .landing-card p.lede{
    font-size:16px;
    color:var(--text);
    margin-bottom:22px;
  }
  .id-box{
    border:1px solid var(--line);
    border-left:4px solid var(--mustard);
    background:#FBF8EF;
    border-radius:4px;
    padding:14px 16px;
    margin:22px 0 26px 0;
  }
  .id-box .label{
    font-size:10.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--text-soft);
    font-weight:bold;
    margin-bottom:6px;
  }
  .id-box .code{
    font-family:'Courier New', monospace;
    font-size:20px;
    font-weight:bold;
    letter-spacing:0.05em;
    color:var(--green-deep);
  }
  .id-box .note{
    font-size:12px;
    color:var(--text-soft);
    margin-top:6px;
    line-height:1.5;
  }
  .privacy-list{
    font-size:13.5px;
    color:var(--text-soft);
    line-height:1.7;
    margin:0 0 26px 0;
    padding-left:20px;
  }
  .privacy-list li{margin-bottom:4px;}

  button{font-family:Arial, Helvetica, sans-serif;cursor:pointer;}
  .btn{
    border:none;
    border-radius:4px;
    font-weight:bold;
    font-size:15px;
    padding:13px 26px;
  }
  .btn-primary{background:var(--orange);color:#fff;}
  .btn-primary:hover{background:var(--orange-deep);}
  .btn-secondary{background:var(--panel);color:var(--green-deep);border:1px solid var(--green);}
  .btn-secondary:hover{background:#EFF6F3;}

  /* ---------- Chat screen ---------- */
  .notice{
    font-size:13px;
    color:var(--text-soft);
    line-height:1.55;
    padding:12px 15px;
    background:#F2EFE5;
    border:1px solid var(--line);
    border-radius:4px;
    margin:18px 0 4px 0;
  }
  .notice b{color:var(--text);}
  .error-banner{
    font-size:13px;color:#7A2415;line-height:1.5;padding:12px 14px;
    background:#FBE7DE;border:1px solid #EDBBA0;border-radius:4px;margin:18px 0 4px 0;
  }
  #chat{
    flex:1;overflow-y:auto;padding:18px 0 12px 0;
    display:flex;flex-direction:column;gap:14px;
  }
  .msg{
    max-width:82%;padding:13px 16px;border-radius:5px;
    font-size:14.5px;line-height:1.6;white-space:pre-wrap;
  }
  .msg.user{
    align-self:flex-end;background:#EFF6F3;border:1px solid #D6E6DF;
  }
  .msg.assistant{
    align-self:flex-start;background:var(--panel);border:1px solid var(--line);
    border-left:3px solid var(--green);
  }
  .role-label{
    font-size:10px;letter-spacing:0.05em;text-transform:uppercase;font-weight:bold;
    display:block;margin-bottom:5px;color:var(--green-deep);
  }
  .msg.user .role-label{color:var(--text-soft);}
  .typing{align-self:flex-start;display:flex;gap:5px;padding:14px 16px;}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--text-soft);opacity:0.4;animation:blink 1.2s infinite ease-in-out;}
  .typing span:nth-child(2){animation-delay:0.2s;}
  .typing span:nth-child(3){animation-delay:0.4s;}
  @keyframes blink{0%,80%,100%{opacity:0.25;}40%{opacity:0.9;}}

  .composer{display:flex;gap:10px;padding:14px 0 16px 0;border-top:1px solid var(--line);background:var(--bg);}
  textarea{
    flex:1;resize:none;border:1px solid var(--line);border-radius:4px;
    padding:11px 13px;font-family:Arial, Helvetica, sans-serif;font-size:14.5px;
    line-height:1.4;background:var(--panel);color:var(--text);min-height:44px;max-height:140px;
  }
  textarea:focus{outline:2px solid var(--green);outline-offset:1px;}
  .send-btn{background:var(--green);color:#fff;padding:0 22px;border-radius:4px;font-weight:bold;font-size:14px;border:none;}
  .send-btn:disabled{background:#A9BEB8;cursor:not-allowed;}
  .send-btn:hover:not(:disabled){background:var(--green-deep);}

  .footer-actions{display:flex;justify-content:space-between;align-items:center;padding:8px 0 20px 0;}
  .end-link{background:none;border:none;color:var(--orange-deep);font-size:13px;font-weight:bold;text-decoration:underline;text-underline-offset:3px;}
  .end-link:hover{color:var(--orange);}
  .turn-count{font-family:'Courier New', monospace;font-size:11px;color:var(--text-soft);}

  /* ---------- End screen ---------- */
  .end-screen{max-width:520px;margin:56px auto;padding:0 20px;text-align:left;}
  .end-screen h2{font-size:25px;color:var(--green-deep);margin-bottom:10px;}
  .end-screen p{color:var(--text-soft);font-size:14.5px;line-height:1.65;margin-bottom:24px;}
  .tag{
    background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--mustard);
    border-radius:4px;padding:20px 22px;margin-bottom:22px;
  }
  .tag .eyebrow{font-size:10.5px;letter-spacing:0.06em;font-weight:bold;color:var(--text-soft);text-transform:uppercase;margin-bottom:10px;}
  .tag .code{
    font-family:'Courier New', monospace;font-size:26px;font-weight:bold;letter-spacing:0.04em;
    color:var(--green-deep);border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);
    padding:14px 0;margin:6px 0 14px 0;user-select:all;
  }
  .copy-btn{background:var(--bg);border:1px solid var(--line);color:var(--text);font-size:13px;font-weight:bold;padding:9px 16px;border-radius:4px;}
  .copy-btn:hover{background:var(--line);}
  .copy-btn.copied{background:var(--green);color:#fff;border-color:var(--green);}
  .return-btn{display:inline-block;background:var(--orange);color:#fff;font-weight:bold;font-size:14.5px;padding:13px 24px;border-radius:4px;text-decoration:none;margin-top:4px;}
  .return-btn:hover{background:var(--orange-deep);}
  .instructions{font-size:13px;color:var(--text-soft);line-height:1.6;background:#F2EFE5;border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin-top:24px;}
  .instructions b{color:var(--text);}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><span class="mark"></span><h1>Workplace Advice &amp; Support</h1></div>
  <div class="status-chip" id="statusText">Anonymous session</div>
</div>

<div id="app" class="wrap"></div>

<script>
/* ============================================================
   RESEARCHER SETUP — edit these before fielding
   ============================================================ */
const WORKER_URL = "https://workplace-study.maryadelua35.workers.dev/";
const RETURN_TO_SURVEY_URL = "https://workplace-study.maryadelua35.workers.dev/";
const MIN_TURNS_BEFORE_END = 2;
/* ============================================================ */

function genId(){
  const alphabet = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  let s = "";
  const arr = new Uint32Array(8);
  crypto.getRandomValues(arr);
  for(let i=0;i<8;i++) s += alphabet[arr[i] % alphabet.length];
  return "WP-" + s;
}

const params = new URLSearchParams(window.location.search);
let pid = params.get("pid");

let session = { pid: null, status: "active", messages: [] };
let ended = false;
let sending = false;
let loadError = null;
let onLanding = true;

async function api(path, opts){
  const resp = await fetch(WORKER_URL + path, opts);
  if(!resp.ok){
    const body = await resp.json().catch(()=>({}));
    throw new Error(body.error || ("Request failed: " + resp.status));
  }
  return resp.json();
}

async function initSession(){
  if(pid){
    try{
      const existing = await api("/api/session?pid=" + encodeURIComponent(pid), { method:"GET" });
      session = existing;
      if(session.status === "completed") ended = true;
      if(session.messages.length > 0) onLanding = false;
      return;
    }catch(e){ /* not found — start fresh under this id */ }
  } else {
    pid = genId();
    history.replaceState(null, "", "?pid=" + pid);
  }
  session = { pid, status: "active", messages: [] };
  try{
    await api("/api/start", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ pid })
    });
  }catch(e){
    loadError = "Couldn't connect to the study server. Check your connection and reload the page.";
    console.error(e);
  }
}

function render(){
  const app = document.getElementById("app");
  if(ended){ renderEndScreen(app); return; }
  if(onLanding){ renderLanding(app); return; }
  renderChat(app);
}

function renderLanding(app){
  app.innerHTML = `
    <div class="landing">
      <div class="landing-card">
        <h2>Welcome to this workplace advice and support space.</h2>
        <p class="lede">I'm here to help you think through a real workplace situation &mdash; a difficult relationship, a career decision, a conflict you're not sure how to handle. Tell me what's going on and I'll work through it with you specifically, not in generalities.</p>

        <div class="id-box">
          <div class="label">Your anonymous session code</div>
          <div class="code">${pid}</div>
          <div class="note">This code, not your name, is what identifies this conversation. You'll be asked to copy it again at the end.</div>
        </div>

        <ul class="privacy-list">
          <li>Nothing you type here is linked to your name, email, or employer.</li>
          <li>Your conversation is recorded for research purposes only.</li>
          <li>You can end the session at any point once you've exchanged a couple of messages.</li>
        </ul>

        ${loadError ? `<div class="error-banner" style="margin:0 0 20px 0;">${loadError}</div>` : ""}
        <button class="btn btn-primary" id="beginBtn" ${loadError?"disabled":""}>Begin conversation</button>
      </div>
    </div>
  `;
  const btn = document.getElementById("beginBtn");
  if(btn){
    btn.addEventListener("click", ()=>{ onLanding = false; render(); });
  }
}

function renderChat(app){
  const userTurns = session.messages.filter(m=>m.role==="user").length;
  const canEnd = userTurns >= MIN_TURNS_BEFORE_END;

  app.innerHTML = `
    ${loadError ? `<div class="error-banner">${loadError}</div>` : `
    <div class="notice"><b>You're anonymous here.</b> Session code <b>${pid}</b>. Describe your situation as specifically as you can &mdash; the more detail you give, the more specific the advice.</div>`}
    <div id="chat"></div>
    <div id="typingRow"></div>
    <div class="composer">
      <textarea id="input" placeholder="Describe what's going on..." rows="1" ${loadError?"disabled":""}></textarea>
      <button class="send-btn" id="sendBtn" ${loadError?"disabled":""}>Send</button>
    </div>
    <div class="footer-actions">
      <span class="turn-count">${userTurns} message${userTurns===1?"":"s"} sent</span>
      <button class="end-link" id="endBtn" ${canEnd?"":"disabled style='opacity:0.4;cursor:not-allowed;text-decoration:none;'"}>
        ${canEnd ? "End session and get my code →" : `Send ${MIN_TURNS_BEFORE_END - userTurns} more to unlock End session`}
      </button>
    </div>
  `;

  const chat = document.getElementById("chat");
  session.messages.forEach(m=>{
    const div = document.createElement("div");
    div.className = "msg " + (m.role === "user" ? "user" : "assistant");
    div.innerHTML = `<span class="role-label">${m.role === "user" ? "You" : "Assistant"}</span>${escapeHtml(m.content)}`;
    chat.appendChild(div);
  });
  chat.scrollTop = chat.scrollHeight;

  if(!loadError){
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    input.addEventListener("keydown", e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); handleSend(); } });
    input.addEventListener("input", ()=>{ input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,140)+"px"; });
    sendBtn.addEventListener("click", handleSend);
    input.focus();
  }
  if(canEnd){
    document.getElementById("endBtn").addEventListener("click", handleEndSession);
  }
}

function escapeHtml(str){ const d=document.createElement("div"); d.innerText=str; return d.innerHTML; }

async function handleSend(){
  if(sending) return;
  const input = document.getElementById("input");
  const text = input.value.trim();
  if(!text) return;
  sending = true;
  input.value = ""; input.style.height = "auto";
  document.getElementById("sendBtn").disabled = true;

  session.messages.push({ role:"user", content:text, ts: new Date().toISOString() });
  render();
  showTyping();

  try{
    const data = await api("/api/chat", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ pid, messages: session.messages })
    });
    hideTyping();
    session.messages.push({ role:"assistant", content: data.reply, ts: data.ts });
  }catch(e){
    hideTyping();
    session.messages.push({ role:"assistant", content:"Something went wrong reaching the assistant. Please try sending your last message again.", ts: new Date().toISOString() });
    console.error(e);
  }
  sending = false;
  render();
  const sendBtn = document.getElementById("sendBtn");
  if(sendBtn) sendBtn.disabled = false;
}

function showTyping(){
  const row = document.getElementById("typingRow");
  if(row) row.innerHTML = `<div class="typing" style="margin:0 0 6px 0;"><span></span><span></span><span></span></div>`;
}
function hideTyping(){ const row = document.getElementById("typingRow"); if(row) row.innerHTML = ""; }

async function handleEndSession(){
  try{
    await api("/api/end", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ pid }) });
  }catch(e){ console.error(e); }
  ended = true;
  render();
}

let copyTimeout;
function copyCode(){
  navigator.clipboard.writeText(pid).then(()=>{
    const btn = document.getElementById("copyBtn");
    btn.textContent = "Copied ✓"; btn.classList.add("copied");
    clearTimeout(copyTimeout);
    copyTimeout = setTimeout(()=>{ btn.textContent="Copy code"; btn.classList.remove("copied"); }, 2000);
  });
}

function renderEndScreen(app){
  document.getElementById("statusText").textContent = "Session ended";
  app.innerHTML = `
    <div class="end-screen">
      <h2>That's the end of this session.</h2>
      <p>Copy your code below, then return to the survey and paste it into the next question. This is the only way your conversation can be matched to your survey answers &mdash; without it, your responses can't be linked.</p>
      <div class="tag">
        <div class="eyebrow">Your anonymous session code</div>
        <div class="code" id="codeDisplay">${pid}</div>
        <button class="copy-btn" id="copyBtn">Copy code</button>
      </div>
      <a class="return-btn" href="${RETURN_TO_SURVEY_URL}">Return to survey →</a>
      <div class="instructions"><b>Next step:</b> once back in the survey, paste this exact code &mdash; <b>${pid}</b> &mdash; into the box asking for your session code. Double-check it matches before continuing.</div>
    </div>
  `;
  document.getElementById("copyBtn").addEventListener("click", copyCode);
}

(async function init(){
  await initSession();
  render();
})();
</script>
</body>
</html>
